<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #download-button {
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            display: block;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        #download-button:focus-visible {
            outline: 1px solid #0072bd;
            outline-offset: -1px;
        }

        .download-svg {
            width: 22px;
            height: 22px;
            display: block;
        }
    </style>
</head>

<body>
    <button id="download-button" type="button" aria-label="Downloads"></button>

    <template id="download-template">
        <svg width="400" height="400" viewBox="0 0 106 106" version="1.1" xmlns="http://www.w3.org/2000/svg"
            xmlns:svg="http://www.w3.org/2000/svg">
            <g id="layer1" transform="translate(13.229167)">
                <circle id="circle844" cx="40" cy="53" r="52" fill="#9c9c9c" fill-opacity="0.19" stroke="#9c9c9c"
                    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                <g id="download-arrow" fill="none" stroke="#5c5c5c" stroke-width="4" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line class="download-line" x1="27" y1="10" x2="53" y2="10" />
                    <line class="download-line" x1="27" y1="20" x2="53" y2="20" />
                    <line class="download-line" x1="7" y1="30" x2="73" y2="30" />
                    <line class="download-line" x1="11" y1="40" x2="69" y2="40" />
                    <line class="download-line" x1="15" y1="50" x2="65" y2="50" />
                    <line class="download-line" x1="19" y1="60" x2="61" y2="60" />
                    <line class="download-line" x1="23" y1="68" x2="57" y2="68" />
                    <line class="download-line" x1="27" y1="76" x2="53" y2="76" />
                    <line class="download-line" x1="31" y1="84" x2="49" y2="84" />
                    <path class="download-line" d="M 31 84 H 49 L 40 96 Z" fill="#5c5c5c" />
                </g>
                <g id="download-orbit" visibility="hidden">
                    <circle class="orbit-ball" cx="83.3333" cy="53" r="8.6667" fill="#0072bd" />
                </g>
            </g>
        </svg>
    </template>

    <script>
        (function () {
            'use strict';

            var downloadButton = document.getElementById('download-button');
            var downloadTemplate = document.getElementById('download-template');
            var matlabHtmlComponent = null;
            var grayColor = '#5c5c5c';
            var blueColor = '#0072bd';
            var orbitElement = null;
            var orbitBalls = [];
            var orbitAnimationFrame = null;
            var orbitLastTimestamp = null;
            var orbitAngle = 0;
            var orbitSpeedRadiansPerSecond = 5.2;
            var orbitCenterX = 40;
            var orbitCenterY = 53;
            var orbitRadius = 43.3333;
            var defaultBallCount = 1;
            var defaultOrbitSpeedRadiansPerSecond = 5.2;

            function send(type) {
                var eventName = type === 'click' ? 'downloadAvatarClick' : 'downloadAvatarReady';
                if (matlabHtmlComponent && typeof matlabHtmlComponent.sendEventToMATLAB === 'function') {
                    matlabHtmlComponent.sendEventToMATLAB(eventName, { type: type });
                } else if (typeof sendEventToMATLAB === 'function') {
                    sendEventToMATLAB(eventName, { type: type });
                }
            }

            function normalizeLevel(value) {
                var level = Number(value);
                if (!isFinite(level)) {
                    level = 0;
                }
                return Math.max(0, Math.min(10, Math.round(level)));
            }

            function normalizeBallCount(value) {
                var count = Number(value);
                if (!isFinite(count)) {
                    count = defaultBallCount;
                }
                return Math.max(0, Math.round(count));
            }

            function normalizeOrbitSpeed(value) {
                var speed = Number(value);
                if (!isFinite(speed)) {
                    speed = defaultOrbitSpeedRadiansPerSecond;
                }
                return Math.max(0, Math.min(100, speed));
            }

            function normalizeState(value) {
                if (value && typeof value === 'object') {
                    return {
                        level: normalizeLevel(value.level),
                        inProgress: value.inProgress === true,
                        ballCount: normalizeBallCount(value.ballCount),
                        speedRadiansPerSecond: normalizeOrbitSpeed(value.speedRadiansPerSecond)
                    };
                }
                return {
                    level: normalizeLevel(value),
                    inProgress: false,
                    ballCount: defaultBallCount,
                    speedRadiansPerSecond: defaultOrbitSpeedRadiansPerSecond
                };
            }

            function animateOrbit(timestamp) {
                if (!orbitElement || orbitBalls.length === 0) {
                    orbitAnimationFrame = null;
                    orbitLastTimestamp = null;
                    return;
                }
                if (orbitLastTimestamp !== null) {
                    orbitAngle += (timestamp - orbitLastTimestamp) / 1000 * orbitSpeedRadiansPerSecond;
                }
                orbitLastTimestamp = timestamp;
                var angleStep = 2 * Math.PI / orbitBalls.length;
                for (var index = 0; index < orbitBalls.length; index += 1) {
                    var angle = orbitAngle + index * angleStep;
                    orbitBalls[index].setAttribute('cx', orbitCenterX + orbitRadius * Math.cos(angle));
                    orbitBalls[index].setAttribute('cy', orbitCenterY + orbitRadius * Math.sin(angle));
                }
                orbitAnimationFrame = requestAnimationFrame(animateOrbit);
            }

            function configureOrbit(element, ballCount) {
                var prototype = element.querySelector('.orbit-ball');
                while (element.firstChild) {
                    element.removeChild(element.firstChild);
                }
                orbitBalls = [];
                for (var index = 0; index < ballCount; index += 1) {
                    var ball = prototype.cloneNode(true);
                    var angle = index * 2 * Math.PI / ballCount;
                    ball.setAttribute('cx', orbitCenterX + orbitRadius * Math.cos(angle));
                    ball.setAttribute('cy', orbitCenterY + orbitRadius * Math.sin(angle));
                    element.appendChild(ball);
                    orbitBalls.push(ball);
                }
            }

            function setOrbitState(element, active, speedRadiansPerSecond) {
                if (orbitAnimationFrame !== null) {
                    cancelAnimationFrame(orbitAnimationFrame);
                    orbitAnimationFrame = null;
                }
                orbitElement = active ? element : null;
                orbitSpeedRadiansPerSecond = speedRadiansPerSecond;
                orbitLastTimestamp = null;
                if (!active) {
                    orbitAngle = 0;
                    orbitBalls = [];
                    return;
                }
                orbitAnimationFrame = requestAnimationFrame(animateOrbit);
            }

            function render(value) {
                var state = normalizeState(value);
                var level = state.level;
                var svg = downloadTemplate.content.firstElementChild.cloneNode(true);
                var lines = svg.querySelectorAll('.download-line');
                var firstActiveLine = lines.length - level;
                var orbit = svg.querySelector('#download-orbit');

                configureOrbit(orbit, state.ballCount);
                svg.classList.add('download-svg');
                for (var index = 0; index < lines.length; index += 1) {
                    lines[index].setAttribute('stroke', index >= firstActiveLine ? blueColor : grayColor);
                    if (lines[index].tagName.toLowerCase() === 'path') {
                        lines[index].setAttribute('fill', index >= firstActiveLine ? blueColor : grayColor);
                    }
                }
                orbit.setAttribute('visibility', state.inProgress ? 'visible' : 'hidden');

                while (downloadButton.firstChild) {
                    downloadButton.removeChild(downloadButton.firstChild);
                }
                downloadButton.appendChild(svg);
                setOrbitState(orbit, state.inProgress, state.speedRadiansPerSecond);
            }

            window.downloadAvatarSetup = function (htmlComponent) {
                matlabHtmlComponent = htmlComponent;
                htmlComponent.addEventListener('DataChanged', function () {
                    render(htmlComponent.Data);
                });
                send('ready');
            };

            var lastPointerClick = 0;
            function notifyClick() {
                var now = Date.now();
                if (now - lastPointerClick < 250) {
                    return;
                }
                lastPointerClick = now;
                send('click');
            }

            downloadButton.addEventListener('pointerdown', notifyClick);
            downloadButton.addEventListener('mousedown', notifyClick);
            downloadButton.addEventListener('click', notifyClick);

            render(0);
        }());

        function setup(htmlComponent) {
            window.downloadAvatarSetup(htmlComponent);
        }
    </script>
</body>

</html>
