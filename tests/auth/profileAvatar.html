<html lang="en">

<head>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #avatar-button {
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            display: block;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        #avatar-button:focus-visible {
            outline: 1px solid #0072bd;
            outline-offset: -1px;
        }

        .avatar-svg {
            width: 22px;
            height: 22px;
            display: block;
        }
    </style>
</head>

    </template>

    <script>
        (function () {
            'use strict';

            var SVG_NS = 'http://www.w3.org/2000/svg';
            var XLINK_NS = 'http://www.w3.org/1999/xlink';
            var avatarButton = document.getElementById('avatar-button');
            var profileOutTemplate = document.getElementById('profile-out-template');
            var profileTemplate = document.getElementById('profile-template');
            var matlabHtmlComponent = null;
            var renderNumber = 0;

            function send(type) {
                var eventName = type === 'click' ? 'profileAvatarClick' : 'profileAvatarReady';
                if (matlabHtmlComponent && typeof matlabHtmlComponent.sendEventToMATLAB === 'function') {
                    matlabHtmlComponent.sendEventToMATLAB(eventName, { type: type });
                } else if (typeof sendEventToMATLAB === 'function') {
                    sendEventToMATLAB(eventName, { type: type });
                }
            }

            function createElement(name) {
                return document.createElementNS(SVG_NS, name);
            }

            function addPhoto(svg, base64) {
                var group = svg.querySelector('g') || svg;
                var defs = svg.querySelector('defs');
                var clipPath = createElement('clipPath');
                var circle = createElement('circle');
                var image = createElement('image');
                var clipID = 'profile-photo-clip-' + renderNumber;
                var dataURI = 'data:image/png;base64,' + base64;

                if (!defs) {
                    defs = createElement('defs');
                    svg.insertBefore(defs, svg.firstChild);
                }

                clipPath.setAttribute('id', clipID);
                clipPath.setAttribute('clipPathUnits', 'userSpaceOnUse');
                circle.setAttribute('cx', '40');
                circle.setAttribute('cy', '53');
                circle.setAttribute('r', '52');
                clipPath.appendChild(circle);
                defs.appendChild(clipPath);

                image.setAttribute('x', '-12');
                image.setAttribute('y', '1');
                image.setAttribute('width', '104');
                image.setAttribute('height', '104');
                image.setAttribute('preserveAspectRatio', 'xMidYMid slice');
                image.setAttribute('clip-path', 'url(#' + clipID + ')');
                image.setAttribute('href', dataURI);
                image.setAttributeNS(XLINK_NS, 'xlink:href', dataURI);

                var text = svg.querySelector('text');
                if (text) {
                    text.setAttribute('visibility', 'hidden');
                    group.insertBefore(image, text);
                } else {
                    group.appendChild(image);
                }
            }

            function render(state) {
                var connected = Boolean(state && state.connected);
                var template = connected ? profileTemplate : profileOutTemplate;
                var svg = template.content.firstElementChild.cloneNode(true);
                var initial = state && state.initial ? String(state.initial).charAt(0).toUpperCase() : '?';
                var photo = state && state.photoPngBase64 ? String(state.photoPngBase64) : '';

                renderNumber += 1;
                svg.classList.add('avatar-svg');
                if (connected) {
                    var text = svg.querySelector('text');
                    if (text) {
                        text.textContent = initial || '?';
                    }
                    if (/^[A-Za-z0-9+/]*={0,2}$/.test(photo) && photo.length > 0) {
                        addPhoto(svg, photo);
                    }
                }
                while (avatarButton.firstChild) {
                    avatarButton.removeChild(avatarButton.firstChild);
                }
                avatarButton.appendChild(svg);
            }

            window.profileAvatarSetup = function (htmlComponent) {
                matlabHtmlComponent = htmlComponent;
                htmlComponent.addEventListener('DataChanged', function () {
                    var state = htmlComponent.Data;
                    if (state && state.action === 'render') {
                        render(state);
                    }
                });
                send('ready');
            };

            var lastPointerClick = 0;
            function notifyClick(event) {
                var now = Date.now();
                if (now - lastPointerClick < 250) {
                    return;
                }
                lastPointerClick = now;
                send('click');
            }

            avatarButton.addEventListener('pointerdown', notifyClick);
            avatarButton.addEventListener('mousedown', notifyClick);
            avatarButton.addEventListener('click', notifyClick);

            render({ connected: false, initial: '?', photoPngBase64: '' });
        }());

        function setup(htmlComponent) {
            window.profileAvatarSetup(htmlComponent);
        }
    </script>

</html>
